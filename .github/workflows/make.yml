name: make
on: push
jobs:
  aarch64-darwin:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v7
    - name: uname-a
      run: uname -a
    - name: install nix from https://github.com/DeterminateSystems/nix-installer/releases/download/v3.24.2/nix-installer.sh
      run: cat nix-installer.sh | sh -s -- install --no-confirm
    - name: nix --version
      run: nix --version
    - name: make
      run: make

  aarch64-linux:
    runs-on: ubuntu-26.04-arm
    steps:
    - uses: actions/checkout@v7
    - name: uname -a
      run: uname -a
    - name: install nix from https://github.com/DeterminateSystems/nix-installer/releases/download/v3.24.2/nix-installer.sh
      run: cat nix-installer.sh | sh -s -- install --no-confirm
    - name: nix --version
      run: nix --version
    - name: make
      run: make

  x86_64-linux:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - name: uname -a
      run: uname -a
    - name: install nix from https://github.com/DeterminateSystems/nix-installer/releases/download/v3.24.2/nix-installer.sh
      run: cat nix-installer.sh | sh -s -- install --no-confirm
    - name: nix --version
      run: nix --version
    - name: make
      run: make
